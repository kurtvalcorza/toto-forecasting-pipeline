[project]
name = "toto-forecasting-pipeline"
version = "0.1.0"
description = "DIMER zero-shot forecasting pipeline for Datadog Toto 2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = ["toto-2==2.0.0", "torch==2.7.0", "numpy==1.26.4", "pandas==2.2.3"]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.12.10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/toto_forecasting_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
